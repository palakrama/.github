name: "🐛 Laporan Bug"
description: Laporkan kendala atau error pada sistem.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Deskripsi Masalah
      description: Jelaskan kendala yang ditemukan secara singkat dan jelas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah Reproduksi
      description: Tuliskan langkah-langkah untuk memunculkan error tersebut.
      placeholder: |
        1. Jalankan perintah '...'
        2. Buka menu '...'
        3. Lihat error pada konsol/terminal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ekspektasi Hasil
      description: Apa yang seharusnya terjadi?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Lingkungan Sistem (Opsional)
      description: OS, versi Go/Python, atau info environment terkait.
      placeholder: "OS: Arch Linux / Ubuntu | Version: 1.x"
